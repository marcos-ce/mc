<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memórias em Fotos | Mozilla</title>
  <meta name="description" content="Página com contador, galeria de fotos e player com músicas locais para compartilhar memórias especiais.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Memórias em Fotos | Mozilla">
  <meta property="og:description" content="Galeria com contador do tempo juntos e trilha local estável.">
  <meta property="og:image" content="assets/images/foto4.jpg">
  <meta property="og:locale" content="pt_BR">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Memórias em Fotos | Mozilla">
  <meta name="twitter:description" content="Galeria com contador do tempo juntos e trilha local estável.">
  <meta name="twitter:image" content="assets/images/foto4.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <img
    src="https://media.tenor.com/zixpOZAH5b0AAAAj/kuromi-hello-kitty.gif"
    class="kuromi-corner"
    alt="Personagem Kuromi decorando o canto da página"
    loading="lazy"
    decoding="async"
  >

  <main class="container">
    <header>
      <h1>Memórias com Mozilla</h1>
    </header>

    <section class="counter-box" aria-label="Contador de tempo juntos">
      <div id="contador" aria-live="polite">Calculando...</div>
    </section>

    <ul id="playlistDados" aria-hidden="true">
      <li data-src="assets/audio/dom-quixote.wav">Dom Quixote (versão instrumental local)</li>
      <li data-src="assets/audio/always.wav">Always (tema local)</li>
      <li data-src="assets/audio/fallen-star.wav">Fallen Star (tema local)</li>
    </ul>

    <section class="player-wrapper paused" id="visualizer" aria-label="Player de música">
      <div class="equalizer" aria-hidden="true">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
      </div>
      <p class="song-title" id="displayTitulo">Carregando...</p>
      <p class="player-status" id="playerStatus" aria-live="polite"></p>
      <audio id="playerAudio" preload="metadata"></audio>
      <div class="controls" role="group" aria-label="Controles do player">
        <button type="button" id="btnPrev" aria-label="Faixa anterior">⏮</button>
        <button type="button" class="play-main" id="btnPlay" aria-label="Tocar música">▶</button>
        <button type="button" id="btnNext" aria-label="Próxima faixa">⏭</button>
      </div>
    </section>

    <p class="quote">Até pode ser que os dragões sejam moinhos de vento...</p>

    <section aria-label="Galeria de fotos">
      <div class="gallery-grid">
        <figure class="polaroid"><img src="assets/images/foto1.jpg" alt="Momento especial 1" width="625" height="415" loading="lazy" decoding="async"></figure>
        <figure class="polaroid"><img src="assets/images/foto4.jpg" alt="Momento especial 2" width="900" height="1600" loading="lazy" decoding="async"></figure>
        <figure class="polaroid"><img src="assets/images/foto8.jpg" alt="Momento especial 3" width="640" height="640" loading="lazy" decoding="async"></figure>
        <figure class="polaroid"><img src="assets/images/foto2.jpg" alt="Momento especial 4" width="512" height="512" loading="lazy" decoding="async"></figure>
        <figure class="polaroid"><img src="assets/images/foto3.jpg" alt="Momento especial 5" width="900" height="986" loading="lazy" decoding="async"></figure>
        <figure class="polaroid"><img src="assets/images/foto7.jpg" alt="Momento especial 6" width="739" height="926" loading="lazy" decoding="async"></figure>
        <figure class="polaroid"><img src="assets/images/foto5.jpg" alt="Momento especial 7" width="720" height="1280" loading="lazy" decoding="async"></figure>
        <figure class="polaroid"><img src="assets/images/foto6.jpg" alt="Momento especial 8" width="1200" height="1473" loading="lazy" decoding="async"></figure>
      </div>
    </section>

    <footer class="footer-note">Te amo, Mozilla ♥</footer>
  </main>

  <script src="assets/js/main.js" defer></script>
</body>
</html>
